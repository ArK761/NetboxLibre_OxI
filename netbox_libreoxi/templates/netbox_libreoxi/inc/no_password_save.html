<script>
  // The password manager of the browser must not offer to save the API / SMTP / PDF secrets: while the form is
  // being sent, the secret fields are plain text fields for the browser (the sent values are the same).
  (function () {
    document.querySelectorAll("form[data-no-password-save]").forEach(function (form) {
      var secrets = function () { return form.querySelectorAll("input[type=password]"); };
      var restore = function () { form.querySelectorAll("input[data-was-password]").forEach(function (input) { input.type = "password"; input.removeAttribute("data-was-password"); }); };
      form.addEventListener("submit", function () {
        secrets().forEach(function (input) { input.setAttribute("data-was-password", "1"); input.type = "text"; });
      }, true);
      form.addEventListener("submit", function (event) { if (event.defaultPrevented) { restore(); } });
      window.addEventListener("pageshow", restore);
    });
  })();
</script>
