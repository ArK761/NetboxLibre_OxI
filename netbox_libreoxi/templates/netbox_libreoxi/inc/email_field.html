<div class="mb-3{% if field.name == 'smtp_username' or field.name == 'smtp_password_input' %} libreoxi-auth{% endif %}{% if field.name == 'audit_email_weekday' %} libreoxi-weekday{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="form-check form-switch">
      {{ field }}
      <label for="{{ field.id_for_label }}" class="form-check-label">{{ field.label }}</label>
    </div>
  {% else %}
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="text-danger">{{ error }}</div>{% endfor %}
</div>
