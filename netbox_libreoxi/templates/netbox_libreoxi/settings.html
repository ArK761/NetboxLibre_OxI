{% extends 'base/layout.html' %}

{% block title %}LibreOXI Settings{% endblock %}

{% block content %}
<div class="row">
  <div class="col-12 col-xl-8">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">LibreOXI Settings</h5>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% include 'form_helpers.html' with form=form %}
          <div class="mt-3">
            <button type="submit" class="btn btn-primary">Apply</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
