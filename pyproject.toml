[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-libreoxi"
version = "1.0.1"
description = "NetBox plugin for LibreNMS Oxidized/OXI configuration history"
requires-python = ">=3.10"
dependencies = ["croniter>=2.0,<7"]

[project.entry-points."netbox_plugins"]
netbox_libreoxi = "netbox_libreoxi:NetBoxLibreOXIConfig"

[tool.setuptools.packages.find]
include = ["netbox_libreoxi*"]

[tool.setuptools.package-data]
netbox_libreoxi = ["templates/**/*.html", "static/**/*.js"]
